<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEX Menu</title>
  <style>
    :root {
      --accent: 192, 0, 0;
      --bg: rgba(8, 8, 10, 0.92);
      --row: rgba(22, 22, 26, 0.95);
      --row-hover: rgba(32, 32, 38, 0.98);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --width: 22vw;
      --min-width: 280px;
      --max-width: 360px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      user-select: none;
    }

    #app {
      position: fixed;
      left: 4vw;
      top: 50%;
      transform: translateY(-50%);
      width: var(--width);
      min-width: var(--min-width);
      max-width: var(--max-width);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #app.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    }

    .banner {
      height: 5.8vw;
      min-height: 72px;
      max-height: 96px;
      background:
        radial-gradient(ellipse 80% 120% at 50% 120%, rgba(var(--accent), 0.55), transparent 60%),
        linear-gradient(180deg, #0a0a0c 0%, #050506 100%);
      position: relative;
      overflow: hidden;
      border-bottom: 2px solid rgb(var(--accent));
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -12deg,
        transparent,
        transparent 18px,
        rgba(var(--accent), 0.07) 18px,
        rgba(var(--accent), 0.07) 20px
      );
      opacity: 0.9;
    }

    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-weight: 800;
      font-size: clamp(28px, 3.2vw, 42px);
      letter-spacing: 0.08em;
      color: rgb(var(--accent));
      text-shadow: 0 0 24px rgba(var(--accent), 0.65);
      z-index: 1;
    }

    .banner-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.35;
      display: none;
    }

    .banner-img.show { display: block; }

    .path-bar {
      text-align: center;
      padding: 0.45vw 0.6vw;
      font-size: clamp(12px, 0.85vw, 14px);
      font-weight: 600;
      color: var(--text);
      background: rgba(18, 18, 22, 0.98);
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.04em;
    }

    .categories {
      display: none;
      gap: 4px;
      padding: 6px 8px;
      background: rgba(14, 14, 18, 0.98);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .categories.show { display: flex; }

    .cat-tab {
      flex: 1;
      min-width: 0;
      padding: 5px 6px;
      font-size: 11px;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-tab.active {
      color: #fff;
      background: rgba(var(--accent), 0.35);
    }

    .list-wrap {
      position: relative;
      max-height: 42vh;
      overflow: hidden;
    }

    .list {
      padding: 4px 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.55vw 12px;
      min-height: 36px;
      color: var(--text);
      font-size: clamp(12px, 0.78vw, 14px);
      background: transparent;
      transition: background 0.12s ease;
    }

    .row.selected {
      background: rgb(var(--accent));
      color: #fff;
    }

    .row.divider {
      justify-content: center;
      font-size: 11px;
      color: var(--muted);
      padding: 8px 12px 4px;
      min-height: auto;
      pointer-events: none;
    }

    .row.disabled { opacity: 0.45; }

    .row-icon {
      width: 18px;
      text-align: center;
      flex-shrink: 0;
      opacity: 0.95;
    }

    .row.selected .row-icon { opacity: 1; }

    .row-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-right {
      flex-shrink: 0;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 1px;
    }

    .row.selected .row-right { color: #fff; }

    .row-meta {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      max-width: 42%;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slider-track {
      width: 56px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .slider-fill {
      height: 100%;
      background: #fff;
      border-radius: 2px;
    }

    .scroll-bar {
      position: absolute;
      right: 3px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      opacity: 0;
    }

    .scroll-bar.show { opacity: 1; }

    .scroll-thumb {
      position: absolute;
      left: 0;
      width: 100%;
      background: rgb(var(--accent));
      border-radius: 2px;
      transition: top 0.15s ease, height 0.15s ease;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      font-size: 10px;
      color: var(--muted);
      background: rgba(12, 12, 14, 0.98);
      border-top: 1px solid var(--border);
    }

    .footer strong { color: #ccc; font-weight: 600; }

    .desc {
      position: fixed;
      left: 50%;
      bottom: 3.5vh;
      transform: translateX(-50%);
      max-width: 50vw;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.82);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #e8e8e8;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
      text-align: center;
    }

    .desc.show { opacity: 1; }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      z-index: 100;
    }

    .overlay.show { display: flex; }

    .keyboard-box {
      width: 320px;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .keyboard-box h3 {
      padding: 12px;
      font-size: 14px;
      background: rgba(var(--accent), 0.25);
      border-bottom: 1px solid var(--border);
    }

    .keyboard-value {
      padding: 16px;
      font-size: 15px;
      color: #fff;
      min-height: 48px;
      word-break: break-all;
    }

    .toast-wrap {
      position: fixed;
      top: 2vh;
      right: 2vw;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
    }

    .toast {
      min-width: 220px;
      padding: 10px 14px;
      background: rgba(12, 12, 16, 0.95);
      border-left: 3px solid rgb(var(--accent));
      border-radius: 4px;
      animation: slideIn 0.25s ease;
    }

    .toast.success { border-left-color: #2ecc71; }
    .toast.error { border-left-color: #e74c3c; }
    .toast.info { border-left-color: #3498db; }

    .toast-title { font-weight: 700; font-size: 13px; color: #fff; }
    .toast-desc { font-size: 11px; color: #aaa; margin-top: 4px; }

    .binds {
      position: fixed;
      right: 2vw;
      top: 50%;
      transform: translateY(-50%);
      width: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      display: none;
      z-index: 50;
    }

    .binds.show { display: block; }

    .binds h4 {
      font-size: 12px;
      margin-bottom: 8px;
      color: rgb(var(--accent));
      text-align: center;
    }

    .bind-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      color: #ddd;
    }

    .freecam {
      position: fixed;
      left: 50%;
      bottom: 8vh;
      transform: translateX(-50%);
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(var(--accent), 0.5);
      border-radius: 4px;
      color: #fff;
      font-size: 13px;
      display: none;
      z-index: 60;
    }

    .freecam.show { display: block; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="panel">
      <div class="banner">
        <div class="banner-img" id="bannerImg"></div>
        <div class="logo" id="logoText">HEX</div>
      </div>
      <div class="path-bar" id="pathBar">Main</div>
      <div class="categories" id="categories"></div>
      <div class="list-wrap">
        <div class="list" id="list"></div>
        <div class="scroll-bar" id="scrollBar"><div class="scroll-thumb" id="scrollThumb"></div></div>
      </div>
      <div class="footer">
        <span>discord.gg/<strong>hexmenu</strong></span>
        <span id="footerUser">HEX</span>
      </div>
    </div>
  </div>

  <div class="desc" id="desc"></div>

  <div class="overlay" id="keyboardOverlay">
    <div class="keyboard-box">
      <h3 id="keyboardTitle">Input</h3>
      <div class="keyboard-value" id="keyboardValue"></div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>
  <div class="binds" id="binds"><h4>Keybinds</h4><div id="bindsList"></div></div>
  <div class="freecam" id="freecam">Freecam</div>

  <script>
    const ICONS = {
      self: "👤", player: "👤", online: "👥", vehicle: "🚗", visual: "👁", weapon: "🔫",
      misc: "🛡", exploit: "💣", setting: "⚙", list: "📋", teleport: "📍", world: "🌍",
      default: "▸"
    };

    const state = {
      visible: false,
      elements: [],
      index: 0,
      path: ["Main"],
      categories: null,
      categoryIndex: 0,
      username: "HEX",
      scrollOffset: 0,
      maxVisible: 9
    };

    const $ = (id) => document.getElementById(id);

    function iconFor(label, type) {
      const l = (label || "").toLowerCase();
      for (const [key, icon] of Object.entries(ICONS)) {
        if (key !== "default" && l.includes(key)) return icon;
      }
      if (type === "subMenu") return "📁";
      return ICONS.default;
    }

    function pathTitle(path) {
      if (!path || !path.length) return "Main";
      const last = path[path.length - 1];
      if (last === "HEX" && path.length === 1) return "Main";
      return last;
    }

    function scrollToIndex(idx) {
      if (idx < state.scrollOffset) state.scrollOffset = Math.max(0, idx);
      if (idx >= state.scrollOffset + state.maxVisible) {
        state.scrollOffset = idx - state.maxVisible + 1;
      }
    }

    function renderCategories() {
      const wrap = $("categories");
      wrap.innerHTML = "";
      if (!state.categories || !state.categories.length) {
        wrap.classList.remove("show");
        return;
      }
      wrap.classList.add("show");
      state.categories.forEach((cat, i) => {
        const tab = document.createElement("div");
        tab.className = "cat-tab" + (i === state.categoryIndex ? " active" : "");
        tab.textContent = cat.label || "Tab";
        wrap.appendChild(tab);
      });
    }

    function rowRight(el) {
      switch (el.type) {
        case "subMenu":
          return "»";
        case "checkbox":
        case "slider-checkbox":
          return el.checked ? "ON" : "OFF";
        case "scrollable":
        case "scrollable-checkbox": {
          const vals = el.values || [];
          const v = el.value || 1;
          return vals[v - 1] != null ? String(vals[v - 1]) : "";
        }
        case "slider": {
          const min = el.min != null ? el.min : 0;
          const max = el.max != null ? el.max : 100;
          const val = el.value != null ? el.value : min;
          return Math.round(val) + "/" + max;
        }
        default:
          return "";
      }
    }

    function renderList() {
      const list = $("list");
      list.innerHTML = "";
      const total = state.elements.length;
      if (total > state.maxVisible) $("scrollBar").classList.add("show");
      else $("scrollBar").classList.remove("show");

      const thumb = $("scrollThumb");
      if (total > state.maxVisible) {
        const h = (state.maxVisible / total) * 100;
        const t = (state.scrollOffset / total) * 100;
        thumb.style.height = h + "%";
        thumb.style.top = t + "%";
      }

      const end = Math.min(total, state.scrollOffset + state.maxVisible);

      for (let i = state.scrollOffset; i < end; i++) {
        const el = state.elements[i];
        if (!el) continue;

        if (el.type === "divider") {
          const row = document.createElement("div");
          row.className = "row divider";
          row.textContent = el.label || "—";
          list.appendChild(row);
          continue;
        }

        const row = document.createElement("div");
        row.className = "row";
        if (i === state.index) row.classList.add("selected");
        if (el.disabled) row.classList.add("disabled");

        const icon = document.createElement("span");
        icon.className = "row-icon";
        icon.textContent = iconFor(el.label, el.type);

        const label = document.createElement("span");
        label.className = "row-label";
        label.textContent = el.label || "—";

        const right = document.createElement("span");
        const meta = rowRight(el);
        if (el.type === "slider") {
          right.className = "row-meta";
          const track = document.createElement("div");
          track.className = "slider-track";
          const fill = document.createElement("div");
          fill.className = "slider-fill";
          const min = el.min != null ? el.min : 0;
          const max = el.max != null ? el.max : 100;
          const val = el.value != null ? el.value : min;
          fill.style.width = ((val - min) / (max - min || 1)) * 100 + "%";
          track.appendChild(fill);
          right.appendChild(track);
        } else if (meta) {
          right.className = el.type === "subMenu" ? "row-right" : "row-meta";
          right.textContent = meta;
        }

        row.appendChild(icon);
        row.appendChild(label);
        if (meta || el.type === "slider") row.appendChild(right);
        list.appendChild(row);
      }

      const cur = state.elements[state.index];
      const desc = $("desc");
      if (cur && cur.desc && state.visible) {
        desc.textContent = cur.desc;
        desc.classList.add("show");
      } else {
        desc.classList.remove("show");
      }
    }

    function render() {
      $("pathBar").textContent = pathTitle(state.path);
      $("footerUser").textContent = state.username || "HEX";
      renderCategories();
      scrollToIndex(state.index);
      renderList();
    }

    function applyData(data) {
      if (data.elements) state.elements = data.elements;
      if (typeof data.index === "number") state.index = data.index;
      if (data.path) state.path = data.path;
      if (typeof data.username !== "undefined") state.username = data.username;
      if (data.categories) state.categories = data.categories;
      else if (data.action === "showUI" && data.visible) {
        /* keep categories unless explicitly cleared */
      }
      if (data.categories === null) state.categories = null;
      if (typeof data.categoryIndex === "number") state.categoryIndex = data.categoryIndex;
      render();
    }

    function showNotification(data) {
      const t = document.createElement("div");
      t.className = "toast " + (data.type || "info");
      t.innerHTML =
        '<div class="toast-title">' +
        (data.title || "Notice") +
        "</div><div class=\"toast-desc\">" +
        (data.desc || "") +
        "</div>";
      $("toasts").appendChild(t);
      setTimeout(() => t.remove(), data.duration || 3000);
    }

    function setBanner(data) {
      if (data.bannerColor) {
        document.documentElement.style.setProperty("--accent", data.bannerColor);
      }
      const img = $("bannerImg");
      if (data.bannerLink) {
        img.style.backgroundImage = 'url("' + data.bannerLink + '")';
        img.classList.add("show");
        $("logoText").style.opacity = "0.35";
      } else {
        img.classList.remove("show");
        $("logoText").style.opacity = "1";
      }
    }

    function showBinds(data) {
      const panel = $("binds");
      const list = $("bindsList");
      if (!data.visible) {
        panel.classList.remove("show");
        return;
      }
      list.innerHTML = "";
      (data.binds || []).forEach((b) => {
        const row = document.createElement("div");
        row.className = "bind-row";
        row.innerHTML = "<span>" + (b.label || "?") + "</span><span>" + (b.key || "—") + "</span>";
        list.appendChild(row);
      });
      panel.classList.add("show");
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || typeof data !== "object" || !data.action) return;

      switch (data.action) {
        case "showUI":
          state.visible = !!data.visible;
          $("app").classList.toggle("visible", state.visible);
          if (!state.visible) {
            $("desc").classList.remove("show");
            state.elements = [];
            state.categories = null;
            state.index = 0;
            render();
            break;
          }
          if (data.elements) state.elements = data.elements;
          if (typeof data.index === "number") state.index = data.index;
          if (data.path) state.path = data.path;
          if (data.username) state.username = data.username;
          if (data.categories) state.categories = data.categories;
          if (typeof data.categoryIndex === "number") state.categoryIndex = data.categoryIndex;
          state.scrollOffset = 0;
          render();
          break;

        case "updateElements":
          applyData(data);
          break;

        case "keydown":
          if (typeof data.index === "number") {
            state.index = data.index;
            scrollToIndex(state.index);
            renderList();
          }
          break;

        case "updateKeyboard":
          $("keyboardOverlay").classList.toggle("show", !!data.visible);
          if (data.title) $("keyboardTitle").textContent = data.title;
          if (typeof data.value !== "undefined") $("keyboardValue").textContent = data.value;
          break;

        case "updateBanner":
          setBanner(data);
          break;

        case "showNotification":
          showNotification(data);
          break;

        case "displayBinds":
          showBinds(data);
          break;

        case "displayFreecam":
          $("freecam").classList.toggle("show", !!data.visible);
          if (data.visible) {
            $("freecam").textContent = "Freecam  |  Weapon: " + (data.weaponIndex || 1) + "  |  Vehicle: " + (data.vehicleIndex || 1);
          }
          break;

        case "updateWeapon":
        case "updateVehicle":
        case "scroll":
          if ($("freecam").classList.contains("show")) {
            $("freecam").textContent =
              "Freecam  |  Weapon: " + (data.index || data.weaponIndex || 1) + "  |  Scroll: " + (data.direction || "");
          }
          break;

        case "updatePosition":
          if (data.position) {
            const app = $("app");
            if (data.position.x === "Left") app.style.left = "4vw";
            if (data.position.x === "Center") { app.style.left = "50%"; app.style.transform = "translate(-50%, -50%)"; }
            if (data.position.x === "Right") { app.style.left = "auto"; app.style.right = "4vw"; }
            if (data.position.y === "Top") app.style.top = "12vh";
            if (data.position.y === "Middle") app.style.top = "50%";
            if (data.position.y === "Bottom") app.style.top = "auto", app.style.bottom = "8vh";
          }
          break;
      }
    });
  </script>
</body>
</html>
